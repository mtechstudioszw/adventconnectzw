# Fast CI for feature branches + PRs: analyze + unit tests only.
#
# The APK/AAB workflows only run on `main` (or manual dispatch), so pushing
# a working branch like `redesign/*` previously produced NO visible CI run.
# This adds a cheap check (no APK build, no release, no artifact storage —
# nothing that eats the free-plan Actions storage) so every branch push and
# pull request gets a green/red analyze+test result. `main` is intentionally
# excluded here because Build APK already analyzes + tests it.

name: Analyze & Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with build-apk.yml / build-aab.yml.
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos matches the build workflows: info-level lints
        # (use_null_aware_elements, TODOs, etc.) stay green; warnings and
        # errors still fail the run.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # The edge function is TypeScript, so neither `flutter analyze` nor
      # `flutter test` can see it — and `supabase functions deploy` is
      # otherwise the first thing that ever parses it. A syntax error
      # would ship from a fully green repo. That has already happened
      # once — an escaped newline sequence written as a REAL newline
      # inside a double-quoted string, which is an unterminated string
      # literal and unparseable. This step is what caught it.
      #
      # Also runs behavioural tests for the scripture-reference parser,
      # the pure function that decides whether Advent AI quotes the real
      # Bible or answers from memory.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Edge function syntax + tests
        run: node supabase/functions/advent-ai/test/run.mjs

      # The Advent AI SQL cannot be executed in CI, so it ships on review
      # alone. Review already missed nothing here only because it was done
      # twice; these are the mechanical checks that do not need a human -
      # duplicate patch numbers, unbalanced $$, ledger values that violate
      # their own CHECK constraint, calls to functions no patch defines,
      # INSERTs naming columns that do not exist, and patches that depend
      # on a later patch than themselves.
      #
      # Validated by negative tests: each check was confirmed to FAIL on a
      # deliberately broken copy before being trusted.
      - name: Advent AI SQL cross-checks
        run: python scripts/check_ai_patches.py
