# Builds a Play-Store-ready signed Android App Bundle (AAB).
# Manual trigger only — there's no reason to burn CI minutes
# producing a signed Play upload artifact on every push.

name: Build AAB (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-aab
  cancel-in-progress: true

jobs:
  build:
    name: Release AAB (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force || true
          echo "=== after ==="
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Cache Gradle and Android SDK downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: gradle-aab-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-aab-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Pub get
        run: flutter pub get

      # ============================================================
      # DIAGNOSTIC CHECK
      # This does NOT modify the project.
      # It checks whether the old calling system or its permissions
      # still exist anywhere in the GitHub checkout / dependency tree.
      # ============================================================
      - name: Diagnose removed calling system
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo "1. FLUTTER DEPENDENCY TREE"
          echo "============================================================"

          flutter pub deps | grep -Ei "webrtc|callkit"

          if [ $? -eq 0 ]; then
            echo ""
            echo "::warning::A WebRTC or CallKit package was found in the Flutter dependency tree."
          else
            echo "No webrtc/callkit packages found in Flutter dependency tree."
          fi

          echo ""
          echo "============================================================"
          echo "2. SOURCE + NATIVE FILE SEARCH"
          echo "============================================================"

          grep -RniE \
            "FOREGROUND_SERVICE_PHONE_CALL|FOREGROUND_SERVICE_MICROPHONE|CallkitNotificationService|flutter_callkit_incoming|flutter_webrtc" \
            android lib pubspec.yaml pubspec.lock \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            2>/dev/null

          if [ $? -eq 0 ]; then
            echo ""
            echo "::warning
