# Builds a debug APK on every push to main and on manual trigger.
# Two ways to download the result:
#
# A) GitHub Release (RECOMMENDED — phone-friendly)
#   1. Open https://github.com/mtechstudioszw/adventconnectzw/releases
#   2. Find the "Latest debug build" release (auto-updated each push)
#   3. Tap the `advent-connect-debug.apk` asset on your phone
#   4. Open the downloaded file → install. No extraction needed.
#
# B) Actions Artifact (the file is wrapped in a .zip)
#   1. Open https://github.com/mtechstudioszw/adventconnectzw/actions
#   2. Click the latest "Build APK" run → scroll to "Artifacts"
#   3. Tap "advent-connect-debug-apk" to download the .zip
#   4. Extract on your phone (use Files by Google or similar) to get
#      the .apk, then tap it to install.
#
# To trigger a manual build without a code push:
#   Actions tab → "Build APK" → "Run workflow" → pick main → Run.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required so the create-release step can push commits/tags + create
# releases under the workflow's default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Debug APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to a specific version so CI doesn't break the next time
          # the stable channel ships a Dart SDK older than our pubspec
          # constraint (^3.11.3 -> requires Flutter 3.38.4+).
          # Bump this when you bump pubspec.yaml's SDK constraint.
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos keeps the build green for stylistic lints
        # (use_null_aware_elements, etc) — warnings and errors still
        # fail the step.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK for release
        # Give the file a friendly name when downloaded by a phone —
        # `app-debug.apk` looks generic in a notifications shade.
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk \
             release/advent-connect-debug.apk

      - name: Upload APK artifact
        # Belt-and-braces: also store the APK as a workflow artifact
        # for the few CI cases where downloading from a release page
        # is awkward. The Release below is the primary distribution.
        #
        # Free GitHub plan caps Actions storage at 0.5 GB total, so
        # 30-day retention was filling it up and silently failing
        # subsequent builds. 3 days keeps a couple of recent APKs
        # available without exhausting the quota. continue-on-error
        # means even if storage IS full, the Release step still runs
        # and the phone-friendly install link keeps updating.
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: advent-connect-debug-apk
          path: release/advent-connect-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish to "Latest debug build" release
        # Always overwrites a single moving tag so the user always
        # downloads from the same URL. Phones get a direct .apk
        # link — no .zip extraction step.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: |
            Auto-built debug APK from commit ${{ github.sha }}.

            **Install on your phone:**
            Tap `advent-connect-debug.apk` below to download → open it
            from the notifications shade → install.
            (You may need to allow "Install unknown apps" for your
            browser the first time.)
          files: release/advent-connect-debug.apk
          prerelease: true
          make_latest: false
