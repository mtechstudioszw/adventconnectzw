# 4G, down from 8G. This is what was killing the release AAB in CI.
#
# The old line asked for an 8G heap plus 4G metaspace. A GitHub-hosted runner
# on a PRIVATE repo has 2 cores and 7G of RAM total — so Gradle alone was
# asking for more than the machine has, before the Kotlin daemon, R8 and the
# OS take their share. Linux does not fail that politely: it lets the
# allocation succeed and then the OOM killer takes the process. What that
# looks like in the log is
#
#   Gradle task bundleRelease failed with exit code 143
#   Error: The operation was canceled.
#
# 143 is SIGTERM, and "canceled" reads like somebody pressed a button, which
# is why runs #43 and #45 both looked like flukes rather than the same bug
# twice. Both died 15-19 minutes in, during minification, which is the
# hungriest phase.
#
# 4G is comfortable for this app and leaves room for everything else. Raise
# it only alongside a bigger runner, never on its own.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a SEPARATE JVM with its own heap, and it
# defaults to inheriting the args above — which is how you end up with two
# processes each believing they may take most of the machine.
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true

# Slow-network resilience: default Gradle HTTP timeouts are 30s, which
# fails on multi-MB Flutter engine JAR downloads over a flaky connection.
# Bump to 10 minutes so a single download has time to finish.
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=600000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=600000
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=600000
