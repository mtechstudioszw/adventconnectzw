org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Slow-network resilience: default Gradle HTTP timeouts are 30s, which
# fails on multi-MB Flutter engine JAR downloads over a flaky connection.
# Bump to 10 minutes so a single download has time to finish.
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=600000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=600000
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=600000
