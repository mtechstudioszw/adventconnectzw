name: advent_connect_zw
description: "Advent Connect ZW — Christian community platform for Zimbabwe"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Firebase + push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Voice notes in chat
  record: ^5.1.2
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # Chat screenshot prevention (Android FLAG_SECURE). Android-only;
  # all call sites must be wrapped in Platform.isAndroid.
  flutter_windowmanager: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
