name: advent_connect_zw
description: "Adventist Super App — connecting SDA people around the globe"
publish_to: 'none'

version: 1.5.0+1037

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  # Advent AI streams its answers as server-sent events, and
  # `functions.invoke()` buffers the whole body before returning — which
  # would turn a progressive answer into a ten-second wait on a blank
  # screen. This needs the streaming client underneath it.
  #
  # NOT a new dependency in practice: http 1.6.0 was already in the tree
  # transitively (supabase_flutter pulls it). Naming it here only makes
  # an existing resolution explicit, so the graph is unchanged.
  http: ^1.6.0
  # End-to-end encryption. The Signal protocol — X3DH + Double Ratchet for
  # 1:1, Sender Keys for groups — which is what WhatsApp runs. Pure Dart
  # (no platform channels), so the crypto is unit-testable in `flutter
  # test` on a machine with no device attached, which is the only way this
  # gets verified here. Hand-rolling any of this would be malpractice: a
  # ratchet bug does not throw, it silently makes history unreadable
  # FOREVER.
  libsignal_protocol_dart: ^0.8.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Firebase + push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.3
  # Promoted from a transitive dep of flutter_local_notifications so the
  # Watch tab can schedule broadcast reminders (zonedSchedule needs a
  # TZDateTime). Pinned to the version already resolved — this adds no
  # new package to the build, it just makes the import legal.
  timezone: 0.9.4

  # Voice notes in chat
  record: ^5.2.0
  audioplayers: ^6.1.0

  # In-app Library MUSIC player with BACKGROUND playback + lock-screen /
  # notification controls (play / pause / next / previous outside the app).
  # just_audio_background wires just_audio to a media session. Pinned exact
  # per project policy. REQUIRES `flutter pub get` + native config (Android
  # audio service in AndroidManifest, iOS UIBackgroundModes audio).
  just_audio: 0.9.42
  just_audio_background: 0.0.1-beta.13
  # Direct (not transitive) because MusicPlayerService has to read and restore
  # `JustAudioPlatform.instance` itself: just_audio_background swaps the
  # platform in BEFORE it finishes initialising, so a failed init leaves the
  # app unable to play anything until the real platform is put back. Version
  # matches what just_audio 0.9.42 already resolves to.
  just_audio_platform_interface: 4.6.0

  # In-app Library — render uploaded Hymnal / EGW-book PDFs natively
  # (Android PdfRenderer / iOS PDFKit). Lightweight. Pinned exact per
  # project policy. REQUIRES `flutter pub get` before building.
  #
  # MUST stay >= 1.4.3: older releases (e.g. 1.3.2) bundled an old Pdfium
  # whose native libs (libjniPdfium / libmodpdfium / libmodft2 / libmodpng /
  # libc++_shared) were 4 KB-aligned, so Google Play rejected the AAB for
  # "does not support 16 KB memory page sizes". 1.4.3+ switched to
  # io.github.oothp:android-pdf-viewer with 16 KB-aligned .so files. Do NOT
  # downgrade below 1.4.3.
  flutter_pdfview: 1.4.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # EGW reflowable reader — reads the White Estate EPUBs, which are ZIP
  # archives of XHTML. Both were ALREADY present as transitive dependencies
  # at exactly these versions, so promoting them adds no download and no
  # bundle weight; it only stops the analyzer's
  # `depend_on_referenced_packages` from firing when we import them
  # directly. Pinned exact per project policy.
  #
  # These replace the PDF path for EGW, and the reason is worth keeping:
  # flutter_pdfview renders PAGES and exposes no text layer, so highlight /
  # copy / share-a-quote are impossible on it. The EPUB carries clean
  # XHTML, the canonical page numbers inline as
  # `<span epub:type="pagebreak" title="18">`, and scripture pre-tagged as
  # `<span class="bible-kjv" title="Colossians 2:3">`. PDFs stay as the
  # fallback for any book without an EPUB.
  archive: 4.0.9
  xml: 6.6.1

  # Admin-only: pick Hymnal/EGW PDFs + Music audio files from the device to
  # upload into the Library. REQUIRES `flutter pub get` before building.
  file_picker: ^8.1.2

  # TODO: Re-add a chat screenshot-prevention package (Android FLAG_SECURE).
  # flutter_windowmanager is abandoned (uses v1 Android embedding) and
  # flutter_windowmanager_plus 1.0.1 forces an old AGP 7.3.0 download that
  # fails on slow networks. Consider `screen_protector` when revisiting.

  # Stage 20 — UI polish
  shimmer: ^3.0.0
  image_cropper: ^8.0.2

  # Stage 20 — Offline mode (last-50 feed cache + offline banner + queued sends)
  hive: ^2.2.3

