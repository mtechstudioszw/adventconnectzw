name: advent_connect_zw
description: "Advent Connect ZW — Christian community platform for Zimbabwe"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Firebase + push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.3

  # Voice notes in chat
  record: ^5.1.2
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # Chat screenshot prevention (Android FLAG_SECURE). Android-only;
  # all call sites must be wrapped in Platform.isAndroid.
  flutter_windowmanager: ^0.2.0

  # Stage 20 — AdMob banner ads
  google_mobile_ads: ^5.3.1

  # Stage 20 — UI polish
  shimmer: ^3.0.0
  image_cropper: ^8.0.2

  # Stage 20 — Offline mode (last-50 feed cache + offline banner + queued sends)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0

  # Auth + biometric + location
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates Android + iOS launcher icons from a single source PNG.
  # Run `dart run flutter_launcher_icons` after dropping a 1024x1024
  # icon at assets/icon/app_icon.png to regenerate.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  # Adaptive icon background matches the dark navy from CLAUDE.md.
  adaptive_icon_background: "#0D1B3E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
