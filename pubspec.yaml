name: advent_connect_zw
description: "Adventist Super App — connecting SDA people around the globe"
publish_to: 'none'

version: 2.0.3+1041

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  http: ^1.6.0
  libsignal_protocol_dart: ^0.8.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

  # Firebase + push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^17.2.3
  timezone: 0.9.4

  # Voice notes in chat
  record: ^5.2.0
  audioplayers: ^6.1.0

  # In-app Library MUSIC player with BACKGROUND playback + lock-screen /
  # notification controls.
  just_audio: 0.9.42
  just_audio_background: 0.0.1-beta.13
  just_audio_platform_interface: 4.6.0

  # In-app Library — render uploaded Hymnal / EGW-book PDFs natively.
  flutter_pdfview: 1.4.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  

  # EGW reflowable reader.
  archive: 4.0.9
  xml: 6.6.1

  # Admin-only file picker.
  file_picker: ^8.1.2

  # Stage 20 — UI polish
  shimmer: ^3.0.0
  image_cropper: ^8.0.2

  # Stage 20 — Offline mode.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.0

  # Auth + biometric + location
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  # AES-256-GCM for encrypted chat photos and voice notes. Already in the
  # lock as a transitive dependency; pinned to that exact version.
  pointycastle: 4.0.0
  local_auth: ^2.3.0
  geolocator: ^13.0.2

  # Maps / external apps.
  url_launcher: ^6.3.1

  # Save downloaded images to the device gallery.
  gal: ^2.3.0

  # Disk-cache network images.
  cached_network_image: ^3.4.0

  # Native share sheet.
  share_plus: ^10.1.4

  # Inbound deep links.
  app_links: ^7.0.0

  # Native Play Store in-app review dialog.
  in_app_review: 2.0.12

  # Appodeal — banner + MREC + interstitial + rewarded ads.
  stack_appodeal_flutter: 4.2.0

  # Premium subscription.
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.0

  # Watch — official YouTube IFrame player.
  youtube_player_iframe: 6.0.2
  webview_flutter: 4.14.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # ---- Audio calling (restored 1 Nov 2026) ---------------------------
  # flutter_webrtc: the media engine; audio is peer-to-peer (or relayed by
  # TURN) and never passes through Supabase. flutter_callkit_incoming:
  # CallKit on iOS, full-screen incoming-call UI on Android. Exact pins
  # are the versions the call client was written against.
  flutter_webrtc: 1.6.0

  # Read-aloud for EGW books (2 Nov 2026): the phone's own text-to-speech
  # voice, offline. No narrated EGW audio exists under a licence we can use.
  flutter_tts: 4.2.5
  flutter_callkit_incoming: 3.1.5

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/bible/
    - assets/hymns/
    - assets/sounds/quiz/
    # The caller's ringback (CallTones). Missing until 3 Nov 2026, so the
    # tone failed silently and callers heard nothing while it rang.
    - assets/sounds/call/
    - assets/fonts/
    - assets/geo/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  background_color_ios: "#022171"
  adaptive_icon_background: "#022171"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
